<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBU Rate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <span class="logo">₴</span>
                <div class="brand-text">
                    <span class="title">NBU Rate</span>
                    <span class="subtitle">Official data · bank.gov.ua</span>
                </div>
            </div>
        </header>

        <main>
            <section class="panel">
                <div class="panel-header">01 / Query</div>
                <div class="panel-content">
                    <div class="form-group">
                        <label for="currency-select">Currency</label>
                        <select id="currency-select">
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="PLN">PLN - Polish Zloty</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date-input">Target Date</label>
                        <input type="date" id="date-input">
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">02 / Latest</div>
                <div class="panel-content" id="latest-rate-container">
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
