<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center pt-5" style="min-height: 100vh;">

    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 600px;">
        <h2 class="text-center mb-4">ToDo List</h2>
        
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Введіть нове завдання...">
            <button class="btn btn-primary" id="addBtn" type="button">ADD</button>
        </div>

        <fieldset class="border p-2 rounded mt-2">
            <legend class="float-none w-auto px-2 fs-6 text-secondary">Список завдань</legend>
            <ul class="list-group list-group-flush" id="taskListContainer">
            </ul>
        </fieldset>
    </div>

    <script>
        const taskList = [];

        class Task {
            constructor(title) {
                this.title = title;
                this.status = "todo";
                this.startDate = this.formatDate(new Date());
                this.endDate = "";
            }

            formatDate(date) {
                const pad = (num) => String(num).padStart(2, '0');
                const yyyy = date.getFullYear();
                const mm = pad(date.getMonth() + 1);
                const dd = pad(date.getDate());
                const hh = pad(date.getHours());
                const min = pad(date.getMinutes());
                return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
            }

            markAsDone() {
                if (this.status !== "done") {
                    this.status = "done";
                    this.endDate = this.formatDate(new Date());
                }
            }
        }

        class ToDoApp {
            constructor() {
                this.inputElement = document.getElementById('taskInput');
                this.addButton = document.getElementById('addBtn');
                this.listContainer = document.getElementById('taskListContainer');

                this.init();
            }

            init() {
                this.addButton.addEventListener('click', () => this.addTask());
                
                this.inputElement.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.addTask();
                    }
                });
            }

            addTask() {
                const title = this.inputElement.value.trim();
                if (!title) return;

                const newTask = new Task(title);
                taskList.push(newTask);
                
                this.inputElement.value = '';
                this.render();
            }

            toggleTaskStatus(index) {
                const task = taskList[index];
                task.markAsDone();
                this.render();
            }

            render() {
                this.listContainer.innerHTML = '';

                taskList.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex flex-column cursor-pointer';
                    li.style.cursor = 'pointer';

                    const titleSpan = document.createElement('span');
                    titleSpan.textContent = task.title;
                    titleSpan.className = 'fw-bold';

                    const dateSpan = document.createElement('small');
                    
                    if (task.status === 'done') {
                        titleSpan.classList.add('text-decoration-line-through', 'text-muted');
                        dateSpan.className = 'text-muted mt-1';
                        dateSpan.textContent = `Створено: ${task.startDate} | Виконано: ${task.endDate}`;
                    } else {
                        dateSpan.className = 'text-secondary mt-1';
                        dateSpan.textContent = `Створено: ${task.startDate}`;
                    }

                    li.appendChild(titleSpan);
                    li.appendChild(dateSpan);

                    li.addEventListener('click', () => this.toggleTaskStatus(index));

                    this.listContainer.appendChild(li);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ToDoApp();
        });
    </script>
</body>
</html>
